# 服务端口
server:
  port: 9171

# Spring配置
spring:
  mvc:
    static-path-pattern: /**
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java

  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/db_music?zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    # Druid 连接池配置
    druid:
      initial-size: 5              # 初始连接数
      min-idle: 5                  # 最小空闲连接数
      max-active: 20               # 最大活跃连接数
      max-wait: 60000              # 获取连接最大等待时间(毫秒)
      time-between-eviction-runs-millis: 60000  # 检测间隔时间
      min-evictable-idle-time-millis: 300000    # 最小生存时间
      validation-query: SELECT 1   # 验证查询
      test-while-idle: true        # 空闲时检测
      test-on-borrow: false        # 借出时不检测
      test-on-return: false        # 归还时不检测
      pool-prepared-statements: true           # 开启PSCache
      max-pool-prepared-statement-per-connection-size: 20  # PSCache大小
      # 配置监控统计拦截的filters
      filters: stat,wall
      # 通过connectProperties属性来打开mergeSql功能；慢SQL记录
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      # 配置DruidStatFilter
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.bmp,*.png,*.css,*.ico,/druid/*"
      # 配置DruidStatViewServlet
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin
  #Json配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  
  #Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password: admin
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
  #文件上传相关配置
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB

  # Flyway配置
  flyway:
    enabled: true  # 临时禁用以修复失败的迁移记录
    # 迁移脚本位置
    locations: classpath:db/migration
    # 编码格式
    encoding: UTF-8
    # 是否开启校验(开发环境可以关闭,避免重复执行问题)
    validate-on-migrate: false
    # 如果数据库不是空的是否允许初始化
    baseline-on-migrate: true
    # 基础版本号
    baseline-version: 0
    # 表名前缀
    table: flyway_schema_history
    # 自动修复失败的迁移
    repair: true

#mybatis 配置
mybatis:
  type-aliases-package: com.shanzhu.music.entity
  mapper-locations: classpath:mapper/*.xml

#pagehelper 分页配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

#JWT配置
jwt:
  # JWT密钥(生产环境请使用更复杂的密钥并放在环境变量中)
  secret: MusicWebsiteSecretKey2026ForJWTTokenGenerationAndValidation
  # Token过期时间(毫秒),默认24小时
  expiration: 86400000

# Actuator监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,loggers,threaddump,heapdump
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
    info:
      access: unrestricted
    metrics:
      access: unrestricted
    env:
      show-values: when-authorized
  info:
    env:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

# SpringDoc OpenAPI配置
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.shanzhu.music.controller
