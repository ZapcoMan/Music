# ==================== 生产环境配置 ====================

# 服务端口
server:
  port: 9171

# Spring配置
spring:
  mvc:
    static-path-pattern: /**
  
  # 热部署 - 生产环境关闭
  devtools:
    restart:
      enabled: false

  # 数据库配置 - 生产MySQL
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/db_music?zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8
    # 生产环境不设默认值：缺失时启动即失败，避免弱口令兜底悄悄上线
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 10              # 初始连接数增加
      min-idle: 10                  # 最小空闲连接数增加
      max-active: 50                # 最大活跃连接数增加
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      web-stat-filter:
        enabled: false              # 生产环境关闭Web监控
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.bmp,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        enabled: false              # 生产环境关闭Druid监控页面
        url-pattern: /druid/*
        # 此前这里是写死的 admin/admin。enabled:false 时它是死配置，但一旦有人翻成 true
        # 就等于对外开一个弱口令控制台；而不配置凭据时 Druid StatViewServlet 更是直接免认证。
        # 所以不给任何"看起来可用"的默认值：要开监控，必须显式注入环境变量。
        # 留空而非无默认值，是为了让关闭状态下部署不必额外配这两个变量。
        login-username: ${DRUID_LOGIN_USERNAME:}
        login-password: ${DRUID_LOGIN_PASSWORD:}
  
  # Json配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  
  # Redis配置 - 生产Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 5000ms               # 超时时间增加
      lettuce:
        pool:
          max-active: 20            # 连接池大小增加
          max-wait: -1ms
          max-idle: 10
          min-idle: 5
  
  # 文件上传配置
  servlet:
    multipart:
      # 此前两值都是 1024MB。Spring 在解析阶段就会按这个上限接收请求体并落临时盘，
      # 而应用层的 FileStorageService 上限只有图片 10MB / 音频 100MB——它在解析之后才校验。
      # 结果是任何匿名或低权请求都能先让服务器写满 1GB 临时文件，才收到一句"文件超过大小上限"，
      # 这是 DoS 面，不是"配置方便"。
      # 现在容器层对齐应用层最大单项（音频 100MB），请求层留 10MB 给 multipart 边界与其余字段；
      # 图片超限仍由 FileStorageService 给出带具体数值的友好错误。
      max-file-size: 100MB
      max-request-size: 110MB

  # Flyway配置 - 生产环境开启校验
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true       # 开启校验
    # 生产原本是 true，风险最高：备份恢复或历史库缺 flyway_schema_history 时，
    # 会把带 DROP TABLE 的 V1 起全部脚本重放一遍，等于上线即清库。
    baseline-on-migrate: false
    table: flyway_schema_history
    repair: false                   # 生产环境关闭自动修复

# MyBatis配置
mybatis:
  type-aliases-package: com.shanzhu.music.entity
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 下划线列名映射到驼峰属性（与 dev/test 一致）
    map-underscore-to-camel-case: true
    # 生产环境关闭SQL日志
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# PageHelper分页配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# JWT配置 - 生产环境使用环境变量
jwt:
  # 必须由环境变量提供；带默认值会让漏配时直接使用源码里的公开密钥，任何人可离线自签令牌
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24小时

# API限流配置
rate-limit:
  enabled: true  # 生产环境开启限流

# Actuator监控配置 - 生产环境限制端点
# CORS 允许的前端来源（逗号分隔，禁止通配符）
# 与 DB/Redis/JWT 不同，这里保留"仅本机"的安全默认值：既不会引入通配风险，
# 也不会让尚未配置该变量的现网部署在我这次改动后直接启动失败
security:
  ip:
    # 是否信任 X-Forwarded-For 一类代理透传头。默认 false：这类头客户端可自行伪造，
    # 一旦信任，JWT 的 IP 绑定可被一个请求头绕过、审计与登录日志的来源 IP 失真、
    # 未登录请求的限流身份可被随意更换。
    # 只有确认后端不对外直连、全部流量经可信 Nginx/SLB 转发时，才改成 true。
    trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus  # 只开放必要端点
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized   # 需要认证才显示详情
      show-components: always
    info:
      access: unrestricted
    metrics:
      access: unrestricted
    env:
      show-values: never              # 属性值含口令，任何情况下都不回显
  info:
    env:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

# SpringDoc OpenAPI配置 - 生产环境关闭
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: false                    # 生产环境关闭
  swagger-ui:
    path: /swagger-ui.html
    enabled: false                    # 生产环境关闭

# 日志配置 - 生产环境简化日志
logging:
  level:
    root: WARN
    com.shanzhu.music: INFO           # 业务代码INFO级别
    com.shanzhu.music.mapper: WARN    # 关闭SQL日志
    com.shanzhu.music.interceptor: WARN  # 拦截器只记录警告
    org.springframework: WARN
    org.springframework.security: WARN
    org.hibernate: ERROR
    com.alibaba.druid: WARN
    org.springframework.data.redis: WARN
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 90                 # 保留更长时间
      total-size-cap: 20GB            # 总容量增加
