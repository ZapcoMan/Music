# ==================== 开发环境配置 ====================

# 服务端口
server:
  port: 9171

# Spring配置
spring:
  mvc:
    static-path-pattern: /**
  
  # 热部署配置
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java

  # 数据库配置 - 本地MySQL
  # 本地默认值保留以便直接起服务，但一律可被环境变量覆盖：
  # 此前这里是写死的 root/root，与 prod 的 ${DB_PASSWORD} 形成两套口径，
  # 一旦误用 dev profile 部署就会静默带着弱口令上线。
  datasource:
    url: jdbc:mysql://localhost:3306/db_music?zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=3000
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.bmp,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        enabled: true               # 仅本地开发开启；对外部署请用 prod（该开关为 false）
        url-pattern: /druid/*
        login-username: ${DRUID_LOGIN_USERNAME:admin}
        login-password: ${DRUID_LOGIN_PASSWORD:admin}
  
  # Json配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  
  # Redis配置 - 本地Redis
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:admin}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB

  # Flyway配置 - 开发环境开启自动迁移
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: false
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history
    repair: true

# MyBatis配置
mybatis:
  type-aliases-package: com.shanzhu.music.entity
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 下划线列名映射到驼峰属性。未开启时所有 resultType 查询里的
    # singer_id / create_time 等列都无法映射（实测返回 null）
    map-underscore-to-camel-case: true
    # 开发环境开启SQL日志
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# PageHelper分页配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# JWT配置
jwt:
  # 本地开发专用占位串，刻意写成一眼是占位的形态，不再是"看起来像真实密钥"的明文。
  # 此前此处是真实密钥形态的明文且已进公开仓库与 git 历史：对任何能读源码的人
  # 那串密钥永久有效，可用它离线自签任意角色（含 admin）的合法令牌。
  # 因此真正的止血动作是轮换——prod 侧换 JWT_SECRET 环境变量即可让旧串作废，
  # 本轮代码改动不能替代那次轮换。
  # prod 不提供默认值：漏配 JWT_SECRET 应启动失败，见 application-prod.yml 与 JwtUtils。
  # 长度 56 字符（448bit）是为满足 HMAC-SHA384 对密钥强度的下限，占位串过短会被 jjwt 拒绝。
  secret: ${JWT_SECRET:dev-only-placeholder-not-a-real-key-change-me-now-please}
  expiration: 86400000  # 24小时

# API限流配置
rate-limit:
  enabled: true  # 开发环境开启限流

# Actuator监控配置 - 只暴露运行所需端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus   # 不再暴露 env / configprops / loggers 等可 dump 配置的端点
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized    # 组件详情含数据源等内部信息，需授权才显示
      show-components: always
    info:
      access: unrestricted
    metrics:
      access: unrestricted
    env:
      show-values: never               # 纵深防御：即便 env 端点被重新打开也不回显属性值
  info:
    env:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

# SpringDoc OpenAPI配置
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.shanzhu.music.controller

# 日志配置 - 开发环境详细日志
logging:
  level:
    root: INFO
    com.shanzhu.music: DEBUG          # 业务代码DEBUG级别
    com.shanzhu.music.mapper: DEBUG   # MyBatis SQL日志
    com.shanzhu.music.interceptor: DEBUG  # 拦截器日志
    org.springframework: INFO
    org.springframework.security: INFO
    org.hibernate: WARN
    com.alibaba.druid: INFO
    org.springframework.data.redis: INFO
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 15
      total-size-cap: 5GB
