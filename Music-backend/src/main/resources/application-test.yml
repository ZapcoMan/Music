# ==================== 测试环境配置 ====================

# 服务端口
server:
  port: 9171

# Spring配置
spring:
  mvc:
    static-path-pattern: /**
  
  # 热部署 - 测试环境关闭
  devtools:
    restart:
      enabled: false

  # 数据库配置 - H2内存数据库(用于单元测试)
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
    type: com.zaxxer.hikari.HikariDataSource
  
  # Json配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  
  # Redis配置 - 使用Embedded Redis或Mock
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Flyway配置 - 测试环境开启
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: false
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history
    repair: true

# MyBatis配置
mybatis:
  type-aliases-package: com.shanzhu.music.entity
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 与 dev/prod 保持一致，避免测试环境掩盖下划线列映射问题
    map-underscore-to-camel-case: true
    # 测试环境开启SQL日志
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# PageHelper分页配置
pagehelper:
  helper-dialect: h2
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# JWT配置 - 测试环境简化
jwt:
  # 仅测试用签名密钥：本地 mvn test 与 CI 都用它自签自验，不对应任何环境的真实凭据，
  # 因此可以明文公开。命名已表达这一点，保持现值不改，避免 dev/prod 的口径被误当作参考。
  secret: MusicBackendJUnitTestSecretKey2026ForHMACSHA384SigningOnly
  # 长度必须 >= 32 字节：jjwt 按 RFC 7518 拒绝短于哈希输出的 HMAC 密钥，
  # 原值只有 29/30 字节，一旦测试里需要签发令牌就会抛 WeakKeyException
  expiration: 3600000  # 1小时

# API限流配置
rate-limit:
  enabled: false  # 测试环境关闭限流,避免影响单元测试

# Actuator监控配置 - 测试环境开放
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
    info:
      access: unrestricted
    metrics:
      access: unrestricted

# SpringDoc OpenAPI配置 - 测试环境开启
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.shanzhu.music.controller

# 日志配置 - 测试环境详细日志
logging:
  level:
    root: INFO
    com.shanzhu.music: DEBUG
    com.shanzhu.music.mapper: DEBUG
    org.springframework: WARN
    org.springframework.security: INFO
    org.hibernate: WARN
    com.alibaba.druid: WARN
    org.springframework.data.redis: WARN
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7
      total-size-cap: 2GB
