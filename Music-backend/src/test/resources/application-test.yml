# 测试环境配置
spring:
  # H2 内存数据库配置
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  # Flyway 配置 - 测试时禁用
  flyway:
    enabled: false

  # H2 的 schema.sql 由 Spring Boot 执行。不指定编码时按平台编码读取，
  # 本机平台编码是 GBK，UTF-8 写的中文种子（歌手名、歌单标题）会全部变乱码，
  # 于是 `singerOfName("%周%")` 之类依赖中文的断言在库里根本查不到东西——
  # 之前能过是因为 Redis 里有历史缓存命中，绕过了数据库，属假绿。
  sql:
    init:
      encoding: UTF-8
  
  # Redis 配置 - 测试时使用嵌入式或 Mock
  data:
    redis:
      host: localhost
      port: 6379
      password: admin

# MyBatis 配置
mybatis:
  type-aliases-package: com.shanzhu.music.entity
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 与 dev/prod 对齐。此前测试环境没有这一行，下划线列映射不到驼峰属性，
    # 于是裸 SQL 结果里的 match_count、singer_id 等列在测试中恒为 null，生产却不是；
    # 用例只能把 null 当期望值写进断言，等于把配置漂移固化成测试口径。
    # 另注：src/main/resources/application-test.yml 会被本文件按 classpath 优先级遮蔽，
    # 测试配置实际只有这一份生效。
    map-underscore-to-camel-case: true

# PageHelper 配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  # 每页上限不靠这里配：max-page-size 对 startPage 起页这条路不生效，
  # 实测 pageSize=5000 会原样返回。真正兜上限的是 common.PageLimits，
  # 由 SongControllerTest#testPageSizeCappedByMaxPageSize 断住。

# JWT 配置(测试用简单密钥)
jwt:
  secret: MusicBackendJUnitTestSecretKey2026ForHMACSHA384SigningOnly
  # 长度必须 >= 32 字节：jjwt 按 RFC 7518 拒绝短于哈希输出的 HMAC 密钥，
  # 原值只有 29/30 字节，一旦测试里需要签发令牌就会抛 WeakKeyException
  expiration: 86400000

# 日志配置
logging:
  level:
    com.shanzhu.music: DEBUG
    org.springframework: WARN

# Actuator 端点暴露——口径与 dev/prod 保持一致
# 此前这里完全没有 management 段，测试上下文走 Spring Boot 默认的"只暴露 health"。
# 注意：这一段并不能让测试直接 GET 到 /actuator/prometheus——
# MockMvcBuilders.webAppContextSetup 只接管 MVC 的 RequestMappingHandlerMapping，
# actuator 端点在独立的 ControllerEndpointHandlerMapping 上，MockMvc 看不见它。
# 它的价值是让 exposure 口径与 dev/prod 同源，避免又一处配置漂移；
# 指标是否装配由 ActuatorMetricsAccessTest 断 bean 来验证。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
