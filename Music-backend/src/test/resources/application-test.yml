# 测试环境配置
spring:
  # H2 内存数据库配置
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  # Flyway 配置 - 测试时禁用
  flyway:
    enabled: false

  # H2 的 schema.sql 由 Spring Boot 执行。不指定编码时按平台编码读取，
  # 本机平台编码是 GBK，UTF-8 写的中文种子（歌手名、歌单标题）会全部变乱码，
  # 于是 `singerOfName("%周%")` 之类依赖中文的断言在库里根本查不到东西——
  # 之前能过是因为 Redis 里有历史缓存命中，绕过了数据库，属假绿。
  sql:
    init:
      encoding: UTF-8
  
  # Redis 配置 - 测试时使用嵌入式或 Mock
  data:
    redis:
      host: localhost
      port: 6379
      password: admin

# MyBatis 配置
mybatis:
  type-aliases-package: com.shanzhu.music.entity
  mapper-locations: classpath:mapper/*.xml

# PageHelper 配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

# JWT 配置(测试用简单密钥)
jwt:
  secret: MusicBackendJUnitTestSecretKey2026ForHMACSHA384SigningOnly
  # 长度必须 >= 32 字节：jjwt 按 RFC 7518 拒绝短于哈希输出的 HMAC 密钥，
  # 原值只有 29/30 字节，一旦测试里需要签发令牌就会抛 WeakKeyException
  expiration: 86400000

# 日志配置
logging:
  level:
    com.shanzhu.music: DEBUG
    org.springframework: WARN
