version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: music-mysql
    restart: always
    environment:
      # 去掉 :-root 兜底：缺变量时让 compose 直接失败，
      # 而不是用弱口令把库起在生产环境上
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?生产环境必须在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: db_music
      TZ: Asia/Shanghai
    # 生产环境不对外暴露 3306；如需 DBA 本机接入，改用
    # "127.0.0.1:13306:3306" 并配合 SSH 隧道
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db_music.sql:/docker-entrypoint-initdb.d/db_music.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max-connections=200
    networks:
      - music-network
    healthcheck:
      # 原写法 mysqladmin ping -h localhost 不带凭据，在开启认证的 MySQL 8 上
      # 会返回 Access denied 并使健康检查长期失败，backend 因此永远等不到依赖就绪
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: music-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?生产环境必须在 .env 中设置 REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru --protected-mode yes
    # 生产环境不对外暴露 6379
    volumes:
      - redis-data:/data
    networks:
      - music-network
    healthcheck:
      # 原写法 redis-cli ping 不带 -a，返回 NOAUTH 但退出码仍为 0，
      # 健康检查会"假通过"；改为带口令并校验 PONG
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # 后端服务
  backend:
    build:
      context: ./Music-backend
      dockerfile: Dockerfile
    container_name: music-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_music?zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?生产环境必须在 .env 中设置 DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?生产环境必须在 .env 中设置 DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?生产环境必须在 .env 中设置 JWT_SECRET（至少 32 字节随机串）}
      # 跨域来源必须显式指定；默认值仅本机，公网部署不改即为坏配置。
      # 变量名对应配置键 security.cors.allowed-origins（Spring 宽松绑定），
      # 写成 SPRING_ 前缀会静默不生效
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?生产环境必须在 .env 中设置 CORS_ALLOWED_ORIGINS}
      SECURITY_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SERVER_PORT: 9171
      TZ: Asia/Shanghai
      # JVM 优化参数
      JAVA_OPTS: >-
        -Xms512m
        -Xmx1024m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/app/logs/heapdump.hprof
    ports:
      - "9171:9171"
    volumes:
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - music-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9171/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
      logging:
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "3"

  # 管理端前端
  admin-frontend:
    build:
      context: ./MusicAdmin-frontend
      dockerfile: Dockerfile
      args:
        VUE_APP_API_BASE_URL: ${API_BASE_URL:-http://localhost:9171}
    container_name: music-admin-frontend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - music-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # 用户端前端
  user-frontend:
    build:
      context: ./MusicUser-frontend
      dockerfile: Dockerfile
      args:
        VUE_APP_API_BASE_URL: ${API_BASE_URL:-http://localhost:9171}
    container_name: music-user-frontend
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - backend
    networks:
      - music-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  backend-uploads:
    driver: local
  backend-logs:
    driver: local

networks:
  music-network:
    driver: bridge
