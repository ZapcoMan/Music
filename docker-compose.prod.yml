version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: music-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: db_music
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db_music.sql:/docker-entrypoint-initdb.d/db_music.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max-connections=200
    networks:
      - music-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: music-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-admin} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - music-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # 后端服务
  backend:
    build:
      context: ./Music-backend
      dockerfile: Dockerfile
    container_name: music-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_music?zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-admin}
      JWT_SECRET: ${JWT_SECRET:-MusicWebsiteSecretKey2026ForJWTTokenGenerationAndValidation}
      SERVER_PORT: 9171
      TZ: Asia/Shanghai
      # JVM 优化参数
      JAVA_OPTS: >-
        -Xms512m
        -Xmx1024m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/app/logs/heapdump.hprof
    ports:
      - "9171:9171"
    volumes:
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - music-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9171/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
      logging:
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "3"

  # 管理端前端
  admin-frontend:
    build:
      context: ./MusicAdmin-frontend
      dockerfile: Dockerfile
      args:
        VUE_APP_API_BASE_URL: ${API_BASE_URL:-http://localhost:9171}
    container_name: music-admin-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - music-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # 用户端前端
  user-frontend:
    build:
      context: ./MusicUser-frontend
      dockerfile: Dockerfile
      args:
        VUE_APP_API_BASE_URL: ${API_BASE_URL:-http://localhost:9171}
    container_name: music-user-frontend
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - music-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  backend-uploads:
    driver: local
  backend-logs:
    driver: local

networks:
  music-network:
    driver: bridge
