server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # source map 兜底拦截。config/index.js 的 productionSourceMap 已经关掉，
    # 这条是防它被改回 true、或旧 dist 还挂在卷上时把 .map 交给公网。
    # 必须排在下面的静态资源正则之前——nginx 的正则 location 取第一个命中，
    # 而那条只匹配以 .js/.css 结尾，.js.map 会掉进 location / 被 try_files 命中。
    location ~* \.(js|css)\.map$ {
        deny all;
        return 404;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router history 模式支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理 (如果需要)
    # location /api/ {
    #     proxy_pass http://backend:9171/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
