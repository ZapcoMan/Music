name: CI

# 后端全量校验门禁：编译 + 142 个测试 + JaCoCo 覆盖率四项阈值。
# 与本地 `mvn -B clean verify` 同一条命令，不额外放宽任何门禁。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 测试用 H2 内存库（application-test.yml）且 Flyway 在测试期禁用，
    # 唯一的外部依赖是 Redis：@ActiveProfiles("test") 下缓存读写会真连 localhost:6379。
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        # 口令与 application-test.yml 中的 spring.data.redis.password 保持一致。
        # CI 是一次性环境，这里不是机密，只是让配置对得上。
        options: --requirepass admin

    defaults:
      run:
        shell: bash
        working-directory: Music-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: 工具链自检
        run: |
          java -version
          mvn -version

      - name: 等待 Redis 就绪
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/6379) 2>/dev/null; then
              exec 3<&- 3>&-
              echo "Redis 端口已就绪"
              exit 0
            fi
            sleep 2
          done
          echo "Redis 6379 始终不可达"
          exit 1

      - name: 后端全量校验
        run: mvn -B clean verify

      # 只在失败时留证据，成功不占仓库产物额度
      - name: 失败时上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: Music-backend/target/surefire-reports/
          if-no-files-found: ignore
