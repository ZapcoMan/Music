version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: music-mysql
    restart: always
    environment:
      # 口令一律来自 .env，缺失时 compose 直接拒绝启动，而不是悄悄用弱口令起库
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD（需与 DB_PASSWORD 一致）}
      MYSQL_DATABASE: db_music
      TZ: Asia/Shanghai
    # 不再把 3306 暴露到宿主机所有网卡：后端通过 compose 内部网络访问 mysql:3306。
    # 确需本机调试时临时启用（只绑回环且换端口，避免与本机 MySQL 冲突）：
    # ports:
    #   - "127.0.0.1:13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db_music.sql:/docker-entrypoint-initdb.d/db_music.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    networks:
      - music-network
    healthcheck:
      # 用容器内环境变量取口令，compose 配置文件里不留明文
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: music-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD} --protected-mode yes
    # 同上，不再对外暴露 6379
    volumes:
      - redis-data:/data
    networks:
      - music-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务
  backend:
    build:
      context: ./Music-backend
      dockerfile: Dockerfile
    container_name: music-backend
    restart: always
    environment:
      # 显式指定运行档位。此前这里不设该变量，容器里的 jar 会按 Maven 打包时
      # 注入的默认值落到 dev：而 dev 开着 Druid 监控台（/druid/*，默认口令
      # admin/admin），StatViewServlet 又是独立 Servlet、绕过整条 JWT 拦截器链，
      # 9171 还直接映射到宿主机——等于把 SQL 监控与会话列表摊开。
      # 更矛盾的是本文件已经用 :? 强制要求生产级凭据，凭据按 prod 填、行为却按 dev 跑。
      # 默认改为 prod，仍允许 .env 里显式覆盖成 dev 做本地联调。
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_music?zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?请在 .env 中设置 DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 与 application-prod.yml 的必填占位对应；缺失即启动失败
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      TZ: Asia/Shanghai
    ports:
      - "9171:9171"
    volumes:
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - music-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9171/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 管理端前端
  admin-frontend:
    build:
      context: ./MusicAdmin-frontend
      dockerfile: Dockerfile
      args:
        VUE_APP_API_BASE_URL: http://localhost:9171
    container_name: music-admin-frontend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - music-network

  # 用户端前端
  user-frontend:
    build:
      context: ./MusicUser-frontend
      dockerfile: Dockerfile
      args:
        VUE_APP_API_BASE_URL: http://localhost:9171
    container_name: music-user-frontend
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - backend
    networks:
      - music-network

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  backend-uploads:
    driver: local
  backend-logs:
    driver: local

networks:
  music-network:
    driver: bridge
