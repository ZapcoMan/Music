version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: music-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_music
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db_music.sql:/docker-entrypoint-initdb.d/db_music.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    networks:
      - music-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: music-redis
    restart: always
    command: redis-server --requirepass admin
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - music-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "admin", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务
  backend:
    build:
      context: ./Music-backend
      dockerfile: Dockerfile
    container_name: music-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_music?zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: admin
      JWT_SECRET: MusicWebsiteSecretKey2026ForJWTTokenGenerationAndValidation
      TZ: Asia/Shanghai
    ports:
      - "9171:9171"
    volumes:
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - music-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9171/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 管理端前端
  admin-frontend:
    build:
      context: ./MusicAdmin-frontend
      dockerfile: Dockerfile
      args:
        VUE_APP_API_BASE_URL: http://localhost:9171
    container_name: music-admin-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - music-network

  # 用户端前端
  user-frontend:
    build:
      context: ./MusicUser-frontend
      dockerfile: Dockerfile
      args:
        VUE_APP_API_BASE_URL: http://localhost:9171
    container_name: music-user-frontend
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - music-network

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  backend-uploads:
    driver: local
  backend-logs:
    driver: local

networks:
  music-network:
    driver: bridge
